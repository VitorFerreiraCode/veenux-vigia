# Vigia do Veenux: roda FORA do Railway (GitHub Actions) para avisar o dono quando a plataforma cai,
# inclusive quando o serviço inteiro é suspenso e o bot não consegue avisar ninguém.
# Estado da queda = issue aberta com o rótulo "queda": um aviso ao cair e um ao voltar, nunca a cada rodada.
name: Vigia Veenux

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  actions: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o /api/health
        env:
          HEALTH_URL: ${{ secrets.VEENUX_HEALTH_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$HEALTH_URL" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Cadastre os secrets VEENUX_HEALTH_URL e DISCORD_WEBHOOK_URL."; exit 1
          fi

          # 3 tentativas com 20 s de intervalo: um soluço de rede não vira alarme.
          up=false
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 -o /dev/null "$HEALTH_URL"; then up=true; break; fi
            [ "$attempt" -lt 3 ] && sleep 20
          done

          gh label create queda -R "$REPO" --color d73a4a --description "Veenux fora do ar" --force >/dev/null
          open=$(gh issue list -R "$REPO" --state open --label queda --json number,createdAt --jq '.[0] // empty')
          mention=""; [ -n "$DISCORD_MENTION" ] && mention="<@$DISCORD_MENTION> "
          now=$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')

          discord() {
            jq -n --arg content "$1" '{content: $content, allowed_mentions: {parse: ["users"]}}' |
              curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" >/dev/null ||
              echo "::warning::Falha ao postar no Discord."
          }

          if [ "$up" = false ] && [ -z "$open" ]; then
            gh issue create -R "$REPO" --label queda --title "Veenux fora do ar" \
              --body "O /api/health não respondeu em 3 tentativas ($now, horário de Brasília). Confira o Railway (cobrança, deploy, logs)."
            discord "${mention}🔴 **Veenux fora do ar** desde $now. O /api/health não responde. Confira o Railway (cobrança/suspensão, deploy, logs)."
          elif [ "$up" = true ] && [ -n "$open" ]; then
            number=$(echo "$open" | jq -r .number)
            since=$(echo "$open" | jq -r .createdAt)
            minutes=$(( ($(date +%s) - $(date -d "$since" +%s)) / 60 ))
            if [ "$minutes" -ge 1440 ]; then took="$((minutes / 1440)) dia(s) e $(((minutes % 1440) / 60)) h"
            elif [ "$minutes" -ge 60 ]; then took="$((minutes / 60)) h $((minutes % 60)) min"
            else took="$minutes min"; fi
            gh issue close "$number" -R "$REPO" --comment "Voltou em $now, após cerca de $took."
            discord "${mention}🟢 **Veenux voltou ao ar** ($now), após cerca de $took. O bot confere carrinhos e pagamentos e manda o resumo da queda."
          else
            echo "Sem mudança (no ar: $up)."
          fi

      # O GitHub desativa agendamentos de repositórios sem atividade há 60 dias; reativar a cada rodada evita isso.
      - name: Manter o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/vigia.yml/enable" || true
